<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CelesteCon — AEROSS</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./assets/fonts/space-grotesk-latin-500-normal.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --deep: #0a0e1f;
    --mid: #141b33;
    --gold: #ffd166;
    --cyan: #7fa7c9;
    --warm-white: #f1eaff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--deep);
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* --- Photo carousel with Ken Burns crossfade --- */
  .bg-photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: crossfade 18s infinite;
    filter: saturate(0.85) brightness(0.55);
  }
  .bg-photo:nth-child(1) {
    background-image: url('./assets/loading/school-exterior.png');
    animation-delay: 0s;
  }
  .bg-photo:nth-child(2) {
    background-image: url('./assets/loading/computer-lab.png');
    animation-delay: 6s;
  }
  .bg-photo:nth-child(3) {
    background-image: url('./assets/loading/cubesat-gameplay.png');
    animation-delay: 12s;
  }

  @keyframes crossfade {
    0%   { opacity: 0; transform: scale(1.06); }
    4%   { opacity: 1; }
    28%  { opacity: 1; transform: scale(1.14); }
    33%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* --- Scrim for legibility --- */
  #scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(10,14,31,0.25) 0%, rgba(10,14,31,0.75) 75%),
      linear-gradient(to top, rgba(10,14,31,0.95) 0%, rgba(10,14,31,0.35) 45%, rgba(10,14,31,0.55) 100%);
  }

  /* --- Starfield signature element --- */
  #stars { position: absolute; inset: 0; }

  /* --- Content --- */
  #content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 9vh;
    text-align: center;
  }

  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0.9;
  }

  .wordmark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 6.5rem);
    letter-spacing: 0.02em;
    color: var(--warm-white);
    line-height: 1;
    text-shadow: 0 0 40px rgba(255, 209, 102, 0.25);
  }
  .wordmark span {
    color: var(--gold);
  }

  .tagline {
    margin-top: 16px;
    font-size: 1rem;
    color: var(--warm-white);
    opacity: 0.75;
    letter-spacing: 0.04em;
  }

  /* --- Loading bar --- */
  #loading-wrap {
    margin-top: 48px;
    width: min(320px, 70vw);
  }
  #loading-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }
  #loading-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  #loading-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  /* --- Enter button --- */
  #enter-btn {
    margin-top: 48px;
    padding: 16px 52px;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--deep);
    background: linear-gradient(135deg, var(--gold), #ffb84d);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255, 209, 102, 0.4);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.2s ease;
  }
  #enter-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #enter-btn:hover {
    box-shadow: 0 0 45px rgba(255, 209, 102, 0.6);
  }

  #hidden-until-ready { display: contents; }
</style>
</head>
<body>
  <div id="stage">
    <div class="bg-photo"></div>
    <div class="bg-photo"></div>
    <div class="bg-photo"></div>
    <div id="scrim"></div>
    <canvas id="stars"></canvas>

    <div id="content">
      <div class="eyebrow">AEROSS Presents</div>
      <h1 class="wordmark">CELESTE<span>CON</span></h1>
      <p class="tagline">A CelesteCon Story — Choose your role. Live the event.</p>

      <div id="loading-wrap">
        <div id="loading-label">Loading</div>
        <div id="loading-track"><div id="loading-fill"></div></div>
      </div>

      <button id="enter-btn">Enter</button>
    </div>
  </div>

  <script>
    // Starfield -- lightweight canvas twinkle, the "Celeste" signature element
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const STAR_COUNT = 90;
    const stars = Array.from({ length: STAR_COUNT }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.7, // keep stars in the upper sky region
      r: Math.random() * 1.4 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.01,
    }));

    function drawStars(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
        ctx.globalAlpha = 0.15 + twinkle * 0.65;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    requestAnimationFrame(drawStars);

    // Simulated loading -> reveal Enter button
    // (Real asset preloading can replace this timer later without touching the UI.)
    const fill = document.getElementById('loading-fill');
    const label = document.getElementById('loading-label');
    const enterBtn = document.getElementById('enter-btn');
    let progress = 0;
    const loadTimer = setInterval(() => {
      progress += Math.random() * 18 + 6;
      if (progress >= 100) {
        progress = 100;
        clearInterval(loadTimer);
        label.textContent = 'Ready';
        setTimeout(() => enterBtn.classList.add('visible'), 200);
      }
      fill.style.width = progress + '%';
    }, 220);

    // HOOK POINT: wire this to the role-select screen once it exists.
    enterBtn.addEventListener('click', () => {
      console.log('[CelesteCon] Enter pressed -- next: role-select screen (Org / Participant / Judge)');
      // window.location.href = './role-select.html';
    });
  </script>
</body>
</html>
